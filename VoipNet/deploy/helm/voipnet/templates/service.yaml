{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "voipnet.fullname" . }}
  labels:
    {{- include "voipnet.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "voipnet.selectorLabels" . | nindent 4 }}
  ports:
    - name: sip
      port: {{ .Values.sip.port }}
      targetPort: sip
      protocol: {{ if eq .Values.sip.transport "udp" }}UDP{{ else }}TCP{{ end }}
    {{- if .Values.http.enabled }}
    - name: http
      port: {{ .Values.http.port }}
      targetPort: http
      protocol: TCP
    {{- end }}
{{- end }}
