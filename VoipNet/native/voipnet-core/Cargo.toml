[package]
name = "voipnet-core"
description = "Voip.NET native SIP/RTP/WebRTC media engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "voipnet_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
parking_lot = "0.12"
rand = "0.8"
md-5 = "0.10"
sha1 = "0.10"
hmac = "0.12"
aes = "0.8"
ctr = "0.9"
base64 = "0.22"
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
rustls-pki-types = { version = "1", features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
ring = "0.17"
opus = { version = "0.4", optional = true }
sonora = { version = "0.2", optional = true }
dimpl = { version = "0.7", default-features = false, features = ["rust-crypto"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "media"
harness = false

[features]
default = ["opus", "audio-processing"]
# Echo cancellation, noise suppression and gain control (WebRTC APM port).
audio-processing = ["dep:sonora"]
