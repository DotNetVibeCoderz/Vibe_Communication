[package]
name = "voipnet-core"
description = "Voip.NET native SIP/RTP/WebRTC media engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "voipnet_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
parking_lot = "0.12"
rand = "0.8"
md-5 = "0.10"
sha1 = "0.10"
hmac = "0.12"
aes = "0.8"
ctr = "0.9"
base64 = "0.22"
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]

[features]
default = []
