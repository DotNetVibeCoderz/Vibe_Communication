<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>RumbleApp</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" href="data:,">
    <style>
        #blazor-error-ui { display: none; position: fixed; inset: auto 16px 16px 16px; padding: 12px 16px; border-radius: 6px; background: #b8432f; color: #fff; z-index: 1000; }
        #blazor-error-ui .reload { color: #fff; font-weight: 600; margin-left: 8px; }
        #blazor-error-ui .dismiss { float: right; cursor: pointer; }
        #app:empty::before, .boot { font: 600 12px/1 "Chakra Petch", sans-serif; letter-spacing: .14em; color: #57656b; position: fixed; inset: 50% 0 auto; text-align: center; }
    </style>
</head>

<body>
    <div id="app"><div class="boot">RUMBLE</div></div>

    <div id="blazor-error-ui" data-nosnippet>
        Something went wrong in the app.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">✕</span>
    </div>

    <script src="js/rumble.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>

</html>
